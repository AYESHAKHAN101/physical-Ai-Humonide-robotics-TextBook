# Book Module API Contracts: ROS2 Nervous System

**Date**: 2025-12-26
**Feature**: 001-ros2-nervous-system
**Contract Version**: 1.0.0

## Overview

This document defines the conceptual API contracts for the ROS2 Nervous System Book Module. Since this is educational content, the "APIs" represent the interfaces and patterns that will be taught to users for interacting with ROS 2 systems.

## Core Concepts API

### ROS2Architecture Interface

**Description**: Represents the distributed ROS 2 architecture

**Methods**:
- `create_node(name: string) -> ROS2Node`: Creates a new computational unit
- `get_nodes() -> List[ROS2Node]`: Retrieves all active nodes
- `get_topics() -> List[TopicInfo]`: Lists all available topics
- `get_services() -> List[ServiceInfo]`: Lists all available services

### ROS2Node Interface

**Description**: Represents a computational unit in the ROS 2 system

**Methods**:
- `create_publisher(topic: string, msg_type: string, qos: QoS) -> Publisher`: Creates a message publisher
- `create_subscription(topic: string, msg_type: string, callback: function, qos: QoS) -> Subscriber`: Creates a message subscriber
- `create_service(srv_name: string, srv_type: string, callback: function) -> ServiceServer`: Creates a service server
- `create_client(srv_name: string, srv_type: string) -> ServiceClient`: Creates a service client
- `create_action_server(name: string, action_type: string, execute_callback: function) -> ActionServer`: Creates an action server
- `create_action_client(name: string, action_type: string) -> ActionClient`: Creates an action client

## Message Types API

### Standard Message Types

**sensor_msgs/JointState**
- name: List[string]
- position: List[float]
- velocity: List[float]
- effort: List[float]

**geometry_msgs/Twist**
- linear: Vector3
- angular: Vector3

**std_msgs/String**
- data: string

**action_msgs/GoalStatusArray**
- status_list: List[GoalStatus]

## Communication Pattern APIs

### Publisher API

**Methods**:
- `publish(message: Message)`: Publishes a message to the topic
- `is_activated() -> bool`: Checks if the publisher is active

### Subscriber API

**Methods**:
- `set_callback(callback: function)`: Sets the message callback function
- `get_subscription_handle() -> SubscriptionHandle`: Gets the subscription handle

### Service Server API

**Methods**:
- `handle_request(request: Request, response: Response) -> Response`: Handles an incoming service request
- `is_available() -> bool`: Checks if the service is available

### Service Client API

**Methods**:
- `async_send_request(request: Request) -> Future[Response]`: Sends an asynchronous service request
- `wait_for_service(timeout: Duration) -> bool`: Waits for the service to become available

### Action Server API

**Methods**:
- `execute_callback(goal_handle: GoalHandle) -> Result`: Executes the action goal
- `publish_feedback(feedback: Feedback)`: Publishes action feedback
- `succeed_current()`: Marks current goal as succeeded

### Action Client API

**Methods**:
- `async_send_goal(goal: Goal) -> Future[GoalHandle]`: Sends an action goal
- `async_get_result(goal_handle: GoalHandle) -> Future[Result]`: Gets action result
- `cancel_goal(goal_handle: GoalHandle) -> Future[CancelResponse]`: Cancels an action goal

## Robot Model API

### URDF Interface

**Methods**:
- `load_from_file(file_path: string) -> RobotModel`: Loads robot model from URDF file
- `get_links() -> List[LinkInfo]`: Gets all links in the robot
- `get_joints() -> List[JointInfo]`: Gets all joints in the robot
- `get_chain(root: string, tip: string) -> List[string]`: Gets kinematic chain from root to tip

## AI Agent Integration API

### AIAgent Interface

**Methods**:
- `connect_to_ros(ros_context: ROS2Architecture) -> bool`: Connects the AI agent to ROS 2
- `register_input_topic(topic: string, msg_type: string)`: Registers a topic for input
- `register_output_topic(topic: string, msg_type: string)`: Registers a topic for output
- `process_sensor_data(sensor_data: Map[string, Message]) -> ControlCommand`: Processes sensor data and generates control commands
- `execute_behavior(behavior_name: string, parameters: Map[string, any]) -> ExecutionStatus`: Executes a named behavior

## Control Flow API

### ControlFlow Interface

**Methods**:
- `set_ai_intent(intent: string) -> ControlFlow`: Sets the high-level AI intent
- `translate_to_ros_messages(intent: string) -> List[ROSMessage]`: Translates AI intent to ROS messages
- `execute_control_loop() -> ExecutionStatus`: Executes the control loop with feedback
- `get_feedback() -> FeedbackData`: Gets feedback from the control loop

## Error Handling API

### Common Error Types

- `ConnectionError`: Failed to connect to ROS 2 network
- `TopicNotFoundError`: Requested topic does not exist
- `ServiceUnavailableError`: Requested service is not available
- `ActionAbortedError`: Action was aborted during execution
- `InvalidURDFError`: URDF file is malformed or invalid

### Error Handling Methods

- `on_error(error: Error, callback: function)`: Sets error handling callback
- `get_error_history() -> List[Error]`: Gets history of errors
- `is_error_state() -> bool`: Checks if system is in error state

## Quality of Service (QoS) API

### QoS Profile Interface

**Methods**:
- `set_reliability(reliability: ReliabilityPolicy)`: Sets reliability policy
- `set_durability(durability: DurabilityPolicy)`: Sets durability policy
- `set_history(history: HistoryPolicy)`: Sets history policy
- `set_depth(depth: int)`: Sets queue depth for history

## Validation and Testing API

### Contract Validation Methods

- `validate_node_interface(node: ROS2Node) -> ValidationResult`: Validates node interface compliance
- `validate_message_compatibility(msg1: Message, msg2: Message) -> bool`: Checks message compatibility
- `validate_urdf_structure(urdf: RobotModel) -> ValidationResult`: Validates URDF structure
- `test_communication_pattern(pattern: CommunicationPattern) -> TestResult`: Tests communication pattern

## Usage Examples

### Creating a Simple AI Agent Node

```python
# Initialize ROS 2 context
ros_arch = ROS2Architecture()
node = ros_arch.create_node("ai_agent")

# Create publisher for robot commands
cmd_publisher = node.create_publisher("cmd_vel", "geometry_msgs/Twist", QoS(10))

# Create subscriber for sensor data
sensor_sub = node.create_subscription("scan", "sensor_msgs/LaserScan", sensor_callback, QoS(10))

# Connect AI agent to ROS
ai_agent = AIAgent()
ai_agent.connect_to_ros(ros_arch)
ai_agent.register_input_topic("scan", "sensor_msgs/LaserScan")
ai_agent.register_output_topic("cmd_vel", "geometry_msgs/Twist")

# Process data and control robot
rclpy.spin(node)
```

### Creating a Control Flow from AI Intent

```python
# Define AI intent
intent = "navigate_to_position(x=1.0, y=2.0, theta=0.0)"

# Create control flow
control_flow = ControlFlow()
control_flow.set_ai_intent(intent)

# Execute control with feedback loop
status = control_flow.execute_control_loop()
feedback = control_flow.get_feedback()
```